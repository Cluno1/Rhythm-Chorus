name: Build Beta Artifacts

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for proper versioning and commit count

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Android-SDK
        uses: android-actions/setup-android@v3

      - name: Create files for signing
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
          PRIVATE_PROPERTIES: ${{ secrets.PRIVATE_PROPERTIES }}
        run: |
          mkdir -p config/signing
          mkdir -p .config
          # Decode keystore and signing property files if secrets are available
          if [ -n "$SIGNING_KEYSTORE" ]; then
            printf '%s' "$SIGNING_KEYSTORE" | base64 -di > ./config/signing/rhythm_keystore.jks
          fi
          if [ -n "$SIGNING_PROPERTIES" ]; then
            printf '%s' "$SIGNING_PROPERTIES" | base64 -di > ./.config/keystore.properties
          fi
          if [ -n "$PRIVATE_PROPERTIES" ]; then
            printf '%s' "$PRIVATE_PROPERTIES" | base64 -di > ./config/signing/private.properties
          else
            touch ./config/signing/private.properties
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compute dynamic version info
        id: version_info
        run: |
          # Parse current versionName & versionCode from build.gradle.kts
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | grep -oE '"[^"]+"' | sed 's/"//g')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | grep -oE '[0-9]+' | head -n 1)
          
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=514121078
          fi
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="5.1.412.1078 Beta"
          fi
          
          # Git commit count for increasing version code
          COMMIT_COUNT=$(git rev-list --count HEAD)
          NEW_VERSION_CODE=$((VERSION_CODE + COMMIT_COUNT))
          
          # Extract short commit hash
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          # Construct version name: e.g., 5.1.412.1078 Beta-build-985-a1b2c3d
          NEW_VERSION_NAME="${VERSION_NAME}-build-${COMMIT_COUNT}-${SHORT_SHA}"
          
          echo "code=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT
          echo "name=$NEW_VERSION_NAME" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "Computed Version Code: $NEW_VERSION_CODE"
          echo "Computed Version Name: $NEW_VERSION_NAME"

      - name: Build with Gradle (GitHub and F-Droid release variants)
        run: |
          ./gradlew assembleGithubRelease assembleFdroidRelease \
            -PversionCodeOverride=${{ steps.version_info.outputs.code }} \
            -PversionNameOverride="${{ steps.version_info.outputs.name }}" \
            -PreleaseDateOverride=$(date +%Y-%m-%d) \
            --stacktrace

      - name: Upload Beta APKs
        uses: actions/upload-artifact@v4
        with:
          name: Rhythm-Beta-Artifacts
          path: |
            app/build/outputs/apk/github/release/Rhythm-*-githubRelease*.apk
            app/build/outputs/apk/fdroid/release/Rhythm-*-fdroidRelease*.apk
          retention-days: 14

      # ── Notifications ────────────────────────────────────────────────────────

      - name: Locate GitHub-flavor Beta APK
        if: success()
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/github/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found — skipping notifications."
            echo "path=" >> $GITHUB_OUTPUT
          else
            echo "path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "Found APK: $APK_PATH"
          fi

      - name: Send Beta APK to Telegram
        if: >
          success() &&
          steps.find_apk.outputs.path != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not set — skipping."
            exit 0
          fi
          CAPTION="🎵 *Rhythm Beta Build*"
          CAPTION+=$'\n\n'
          CAPTION+="📦 *Version:* \`${{ steps.version_info.outputs.name }}\`"
          CAPTION+=$'\n'
          CAPTION+="🔢 *Build \#:* \`${{ steps.version_info.outputs.commit_count }}\`"
          CAPTION+=$'\n'
          CAPTION+="🔗 *Commit:* \`${{ steps.version_info.outputs.short_sha }}\`"
          CAPTION+=$'\n'
          CAPTION+="📅 *Date:* \`$(date +%Y-%m-%d)\`"
          CAPTION+=$'\n\n'
          CAPTION+="⚠️ _This is a beta build\. Report issues on GitHub\._"
          CAPTION+=$'\n\n'
          CAPTION+="[🔍 View Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${{ steps.find_apk.outputs.path }}" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=MarkdownV2" \
            | tee /tmp/tg_response.json \
            && grep -q '"ok":true' /tmp/tg_response.json \
            && echo "✅ Telegram notification sent." \
            || { echo "❌ Telegram notification failed:"; cat /tmp/tg_response.json; exit 1; }

      - name: Send Beta notification to Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "⚠️ Discord webhook URL not set — skipping."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BUILD_DATE="$(date +%Y-%m-%d)"

          cat > /tmp/discord_payload.json <<EOF
          {
            "username": "Rhythm CI",
            "avatar_url": "https://github.com/cromaguy/Rhythm/raw/main/assets/icon.png",
            "embeds": [
              {
                "title": "🎵 Rhythm Beta Build Available",
                "description": "A new beta build has been compiled and is ready for testing.",
                "url": "${RUN_URL}",
                "color": 7340031,
                "fields": [
                  {
                    "name": "📦 Version",
                    "value": "\`${{ steps.version_info.outputs.name }}\`",
                    "inline": false
                  },
                  {
                    "name": "🔢 Build #",
                    "value": "\`${{ steps.version_info.outputs.commit_count }}\`",
                    "inline": true
                  },
                  {
                    "name": "🔗 Commit",
                    "value": "\`${{ steps.version_info.outputs.short_sha }}\`",
                    "inline": true
                  },
                  {
                    "name": "📅 Date",
                    "value": "${BUILD_DATE}",
                    "inline": true
                  },
                  {
                    "name": "📥 Download APK",
                    "value": "[Open Actions Run](${RUN_URL}) → Download from the Artifacts section",
                    "inline": false
                  },
                  {
                    "name": "⚠️ Note",
                    "value": "This is a **beta build**. Please report any issues on [GitHub Issues](https://github.com/${{ github.repository }}/issues).",
                    "inline": false
                  }
                ],
                "footer": {
                  "text": "Rhythm CI • Beta Channel"
                },
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
          EOF

          curl -s -X POST "${DISCORD_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d @/tmp/discord_payload.json \
            | tee /tmp/discord_response.json \
            && echo "✅ Discord notification sent." \
            || { echo "❌ Discord notification failed:"; cat /tmp/discord_response.json; exit 1; }
