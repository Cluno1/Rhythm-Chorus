name: Sonorus Debug Update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: sonorus-debug-update
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: sonorus-debug
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Allocate monotonically increasing Debug version
        id: version
        shell: bash
        run: |
          echo "code=$((100000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=1.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Prepare fixed Debug identities
        env:
          KEYSTORE_B64: ${{ secrets.SONORUS_DEBUG_SIGNING_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.SONORUS_DEBUG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SONORUS_DEBUG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SONORUS_DEBUG_KEY_PASSWORD }}
          MANIFEST_PRIVATE_KEY: ${{ secrets.SONORUS_DEBUG_MANIFEST_PRIVATE_KEY }}
          MANIFEST_PUBLIC_KEY: ${{ vars.SONORUS_DEBUG_MANIFEST_PUBLIC_KEY }}
          EXPECTED_CERT_SHA256: ${{ vars.SONORUS_DEBUG_CERT_SHA256 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          test -n "$MANIFEST_PRIVATE_KEY" && test -n "$MANIFEST_PUBLIC_KEY" && test -n "$EXPECTED_CERT_SHA256"
          mkdir -p config/signing .config
          printf '%s' "$KEYSTORE_B64" | base64 --decode > config/signing/sonorus-debug.jks
          {
            echo 'store_file=config/signing/sonorus-debug.jks'
            echo "store_password=$STORE_PASSWORD"
            echo "key_alias=$KEY_ALIAS"
            echo "key_password=$KEY_PASSWORD"
          } > .config/debug-keystore.properties
          printf '%s' "$MANIFEST_PRIVATE_KEY" > .config/sonorus-debug-manifest.pem
          chmod 600 .config/sonorus-debug-manifest.pem

      - name: Build fixed-signer Debug APK
        env:
          MANIFEST_PUBLIC_KEY: ${{ vars.SONORUS_DEBUG_MANIFEST_PUBLIC_KEY }}
        shell: bash
        run: |
          ./gradlew testGithubDebugUnitTest lintGithubDebug assembleGithubDebug \
            -PversionNameOverride=${{ steps.version.outputs.name }} \
            -PversionCodeOverride=${{ steps.version.outputs.code }} \
            -PreleaseDateOverride=$(date -u +%F) \
            -PsonorusDebugManifestPublicKey="$MANIFEST_PUBLIC_KEY" \
            --stacktrace

      - name: Build and verify signed Debug manifest
        env:
          EXPECTED_CERT_SHA256: ${{ vars.SONORUS_DEBUG_CERT_SHA256 }}
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APK="$(find app/build/outputs/apk/github/debug -maxdepth 1 -type f -name 'Sonorus-*-githubDebug-arm64-v8a.apk' -print -quit)"
          test -x "$APKSIGNER" && test -x "$AAPT" && test -n "$APK"
          scripts/build_update_manifest.py \
            --channel debug \
            --apk "$APK" \
            --abi arm64-v8a \
            --manifest-key .config/sonorus-debug-manifest.pem \
            --expected-certificate-sha256 "$EXPECTED_CERT_SHA256" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --release-note "Automated Debug build $GITHUB_SHA" \
            --output-root build/sonorus-updates \
            --aapt "$AAPT" \
            --apksigner "$APKSIGNER"

      - uses: actions/upload-artifact@v6
        id: debug-artifact
        with:
          name: Sonorus-debug-${{ github.run_number }}
          path: build/sonorus-updates/debug

      - name: Ask the server to pull the artifact through its proxy
        env:
          DEPLOY_KEY: ${{ secrets.SONORUS_UPDATE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SONORUS_UPDATE_KNOWN_HOSTS }}
          SSH_TARGET: ${{ vars.SONORUS_UPDATE_SSH_TARGET }}
          ARTIFACT_ID: ${{ steps.debug-artifact.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.debug-artifact.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS" && test -n "$SSH_TARGET"
          test -n "$ARTIFACT_ID" && test -n "$ARTIFACT_SHA256" && test -n "$GH_TOKEN"
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/sonorus_update
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/sonorus_update
          chmod 600 ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/sonorus_update\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 20\n  ServerAliveInterval 15\n  ServerAliveCountMax 3\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          for attempt in 1 2 3; do
            headers="$(mktemp)"
            if curl -fsS \
              --connect-timeout 10 \
              --max-time 30 \
              --dump-header "$headers" \
              --output /dev/null \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"; then
              artifact_url="$(sed -n 's/^[Ll]ocation: //p' "$headers" | tr -d '\r' | tail -1)"
            else
              artifact_url=''
            fi
            rm -f "$headers"
            if test -n "$artifact_url" && printf '%s\n' "$artifact_url" | ssh "$SSH_TARGET" \
              /usr/local/bin/sonorus-pull-update \
              --artifact-id "$ARTIFACT_ID" \
              --artifact-sha256 "$ARTIFACT_SHA256" \
              --source-run-id "$GITHUB_RUN_ID" \
              --source-sha "$GITHUB_SHA"; then
              exit 0
            fi
            echo "server-side artifact pull attempt $attempt failed" >&2
            sleep 5
          done
          exit 1
