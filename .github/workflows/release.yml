name: Sonorus Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Validate release identity and version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release version must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
          if (( MINOR > 999 || PATCH > 999 )); then
            echo "Minor and patch must be <= 999" >&2
            exit 1
          fi
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Require fixed Sonorus signing credentials
        env:
          KEYSTORE_B64: ${{ secrets.SONORUS_SIGNING_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.SONORUS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SONORUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SONORUS_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          mkdir -p config/signing .config
          printf '%s' "$KEYSTORE_B64" | base64 --decode > config/signing/sonorus-release.jks
          {
            echo 'store_file=config/signing/sonorus-release.jks'
            echo "store_password=$STORE_PASSWORD"
            echo "key_alias=$KEY_ALIAS"
            echo "key_password=$KEY_PASSWORD"
          } > .config/keystore.properties

      - name: Test, lint and build signed GitHub release
        run: >-
          ./gradlew testGithubDebugUnitTest lintGithubRelease assembleGithubRelease
          -PversionNameOverride=${{ steps.version.outputs.name }}
          -PversionCodeOverride=${{ steps.version.outputs.code }}
          -PreleaseDateOverride=$(date -u +%F)
          --stacktrace

      - name: Verify and checksum release APKs
        shell: bash
        run: |
          scripts/check_sonorus_brand.py
          scripts/verify_brand_assets.sh
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          cd app/build/outputs/apk/github/release
          shopt -s nullglob
          apks=(Sonorus-*-githubRelease*.apk)
          test ${#apks[@]} -gt 0
          signer=""
          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose "$apk"
            cert="$($APKSIGNER verify --print-certs "$apk")"
            ! grep -q 'CN=Android Debug' <<< "$cert"
            current="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$cert")"
            test -n "$current"
            if [[ -z "$signer" ]]; then signer="$current"; else test "$current" = "$signer"; fi
            "$AAPT" dump badging "$apk" | grep -q "^package: name='io.github.cluno1.sonorus'"
            sha256sum "$apk" > "$apk.sha256"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: Sonorus-${{ steps.version.outputs.name }}-signed
          path: |
            app/build/outputs/apk/github/release/Sonorus-*-githubRelease*.apk
            app/build/outputs/apk/github/release/Sonorus-*-githubRelease*.apk.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Sonorus ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/github/release/Sonorus-*-githubRelease*.apk
            app/build/outputs/apk/github/release/Sonorus-*-githubRelease*.apk.sha256
