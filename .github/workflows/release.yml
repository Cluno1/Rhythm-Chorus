name: Sonorus Stable Update

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: sonorus-stable-update
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: sonorus-stable
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Validate Stable release tooling
        run: |
          python3 -m py_compile \
            scripts/build_update_manifest.py \
            scripts/server_pull_update_artifact.py \
            scripts/server_sync_update_cos.py
          scripts/check_sonorus_brand.py
          scripts/verify_brand_assets.sh

      - name: Allocate monotonically increasing Stable version
        id: version
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          if (( GITHUB_RUN_NUMBER <= 0 || GITHUB_RUN_NUMBER >= 1000000 )); then
            echo "Stable run number is outside the supported range" >&2
            exit 1
          fi
          MINOR=$((GITHUB_RUN_NUMBER / 1000))
          PATCH=$((GITHUB_RUN_NUMBER % 1000))
          VERSION="1.${MINOR}.${PATCH}"
          CODE=$((1000000 + GITHUB_RUN_NUMBER))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Require fixed Sonorus signing credentials
        env:
          KEYSTORE_B64: ${{ secrets.SONORUS_SIGNING_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.SONORUS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SONORUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SONORUS_KEY_PASSWORD }}
          MANIFEST_PRIVATE_KEY: ${{ secrets.SONORUS_STABLE_MANIFEST_PRIVATE_KEY }}
          MANIFEST_PUBLIC_KEY: ${{ vars.SONORUS_STABLE_MANIFEST_PUBLIC_KEY }}
          EXPECTED_CERT_SHA256: ${{ vars.SONORUS_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          test -n "$MANIFEST_PRIVATE_KEY" && test -n "$MANIFEST_PUBLIC_KEY" && test -n "$EXPECTED_CERT_SHA256"
          mkdir -p config/signing .config
          printf '%s' "$KEYSTORE_B64" | base64 --decode > config/signing/sonorus-release.jks
          {
            echo 'store_file=config/signing/sonorus-release.jks'
            echo "store_password=$STORE_PASSWORD"
            echo "key_alias=$KEY_ALIAS"
            echo "key_password=$KEY_PASSWORD"
          } > .config/keystore.properties
          printf '%s' "$MANIFEST_PRIVATE_KEY" > .config/sonorus-stable-manifest.pem
          chmod 600 .config/sonorus-stable-manifest.pem

      - name: Test, lint and build signed GitHub release
        run: >-
          ./gradlew testGithubDebugUnitTest lintGithubRelease assembleGithubRelease
          -PversionNameOverride=${{ steps.version.outputs.name }}
          -PversionCodeOverride=${{ steps.version.outputs.code }}
          -PreleaseDateOverride=$(date -u +%F)
          -PsonorusStableManifestPublicKey=${{ vars.SONORUS_STABLE_MANIFEST_PUBLIC_KEY }}
          --stacktrace

      - name: Verify and checksum release APKs
        env:
          EXPECTED_CERT_SHA256: ${{ vars.SONORUS_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          scripts/check_sonorus_brand.py
          scripts/verify_brand_assets.sh
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          cd app/build/outputs/apk/github/release
          shopt -s nullglob
          apks=(Sonorus-*-githubRelease*.apk)
          test ${#apks[@]} -gt 0
          signer=""
          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose "$apk"
            cert="$($APKSIGNER verify --print-certs "$apk")"
            ! grep -q 'CN=Android Debug' <<< "$cert"
            current="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$cert")"
            test -n "$current"
            normalized_current="$(tr -d ':' <<< "$current" | tr '[:upper:]' '[:lower:]')"
            normalized_expected="$(tr -d ':' <<< "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
            test "$normalized_current" = "$normalized_expected"
            if [[ -z "$signer" ]]; then signer="$current"; else test "$current" = "$signer"; fi
            "$AAPT" dump badging "$apk" | grep -q "^package: name='io.github.cluno1.sonorus'"
            sha256sum "$apk" > "$apk.sha256"
          done

      - name: Build signed Stable update manifest
        env:
          EXPECTED_CERT_SHA256: ${{ vars.SONORUS_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APK="$(find app/build/outputs/apk/github/release -maxdepth 1 -type f -name 'Sonorus-*-githubRelease-arm64-v8a.apk' -print -quit)"
          test -n "$APK"
          scripts/build_update_manifest.py \
            --channel stable \
            --apk "$APK" \
            --abi arm64-v8a \
            --manifest-key .config/sonorus-stable-manifest.pem \
            --expected-certificate-sha256 "$EXPECTED_CERT_SHA256" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --release-note "Sonorus ${{ steps.version.outputs.name }}" \
            --output-root build/sonorus-updates \
            --aapt "$AAPT" \
            --apksigner "$APKSIGNER"

      - uses: actions/upload-artifact@v6
        id: stable-artifact
        with:
          name: Sonorus-stable-${{ github.run_number }}
          path: build/sonorus-updates/stable
          if-no-files-found: error
          retention-days: 90

      - name: Ask the server to pull and publish the Stable artifact
        env:
          DEPLOY_KEY: ${{ secrets.SONORUS_UPDATE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SONORUS_UPDATE_KNOWN_HOSTS }}
          SSH_TARGET: ${{ vars.SONORUS_UPDATE_SSH_TARGET }}
          ARTIFACT_ID: ${{ steps.stable-artifact.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.stable-artifact.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS" && test -n "$SSH_TARGET"
          test -n "$ARTIFACT_ID" && test -n "$ARTIFACT_SHA256" && test -n "$GH_TOKEN"
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/sonorus_update
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/sonorus_update ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/sonorus_update\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 20\n  ServerAliveInterval 15\n  ServerAliveCountMax 3\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          for attempt in 1 2 3; do
            headers="$(mktemp)"
            if curl -fsS \
              --connect-timeout 10 \
              --max-time 30 \
              --dump-header "$headers" \
              --output /dev/null \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"; then
              artifact_url="$(sed -n 's/^[Ll]ocation: //p' "$headers" | tr -d '\r' | tail -1)"
            else
              artifact_url=''
            fi
            rm -f "$headers"
            if test -n "$artifact_url" && printf '%s\n' "$artifact_url" | ssh "$SSH_TARGET" \
              /usr/local/bin/sonorus-pull-update \
              --channel stable \
              --artifact-id "$ARTIFACT_ID" \
              --artifact-sha256 "$ARTIFACT_SHA256" \
              --source-run-id "$GITHUB_RUN_ID" \
              --source-sha "$GITHUB_SHA"; then
              exit 0
            fi
            echo "server-side Stable artifact pull attempt $attempt failed" >&2
            sleep 5
          done
          exit 1
